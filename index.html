<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Hub – Framework</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/home" aria-label="Engineering Hub, Framework, home"><span class="brand-mark">EH</span><span class="brand-name">Engineering Hub <span class="brand-sep">–</span> <span class="brand-kind">Framework</span></span><span class="proto">Prototype v0.7</span></a>
  <form class="ask" id="ask-form" role="search" aria-label="Ask the Hub">
    <label for="search" class="ask-label"><span class="ask-spark" aria-hidden="true">✦</span>Ask the Hub</label>
    <input id="search" type="search" placeholder="Ask a question, or search pages by title or ID (e.g. fuel, KN-0020)" autocomplete="off">
    <button type="submit" class="ask-btn">Ask</button>
  </form>
</header>
<section id="ask-panel" class="ask-panel" hidden aria-live="polite" aria-label="Ask the Hub results"></section>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="view-switch" role="tablist" aria-label="Navigation view">
      <div class="view-switch-label">View</div>
      <div class="view-buttons" id="view-buttons"></div>
      <div class="view-desc" id="view-desc"></div>
    </div>
    <nav id="tree" class="tree" aria-label="Navigation tree"></nav>
  </aside>
  <main class="main">
    <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></nav>
    <article id="page" class="page"></article>
    <footer class="footer" id="footer"></footer>
  </main>
</div>
<noscript><p style="padding:2em">The Engineering Hub needs JavaScript enabled.</p></noscript>
<script src="data/hub.js"></script>
<script>window.HUB_AI_ENDPOINT = window.HUB_AI_ENDPOINT || null; /* set to the internal AI service URL when available */</script>
<script src="js/ai.js"></script>
<script src="js/app.js"></script>
</body>
</html>
